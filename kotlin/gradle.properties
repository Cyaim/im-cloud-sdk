# Modest heaps on purpose. A library this size does not need a 3 GB compiler daemon, and CI
# containers that only have 2 GB should not have to override anything to build it.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
